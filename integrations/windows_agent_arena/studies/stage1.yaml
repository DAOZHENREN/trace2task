schema_version: "0.1"
study_id: trace2task-stage1
title: Trace2Task Stage 1 - Trace and Experience Effect Study
path_base: ../../..
seed: 20260901
repetitions: 3
model: gpt-5.6-terra
reasoning_effort: low

targets:
  apps: 5
  task_instances: 22
  parameterized_families: 8

primary_metrics:
  - evaluator_success
  - wall_time_seconds
  - model_time_seconds
  - plan_calls
  - action_count
  - recovery_count
  - human_cost_seconds

analysis_plan:
  primary_endpoint: evaluator_success
  pairing_unit: task_variant
  success_analysis: task-paired bootstrap and mixed-effects logistic regression
  efficiency_summary: median, interquartile range, paired effect, and 95% confidence interval
  multiplicity: Holm correction for secondary condition contrasts
  failure_views:
    - intent_to_treat
    - capability_only
  freeze_rule: Do not change tasks, conditions, model settings, or exclusions after a formal run starts.

conditions:
  - id: baseline
    runtime_mode: baseline
    taskpack_role: execution
    purpose: Current screenshot and instruction only.

  - id: raw_trace
    runtime_mode: trace
    taskpack_role: execution
    human_cost_keys: [demonstration]
    purpose: Test whether matched immutable human Trace evidence helps by itself.

  - id: trace_compile
    runtime_mode: compiled
    taskpack_role: trace_compile
    human_cost_keys: [demonstration, compiler_review]
    purpose: Trace compiled into semantic experience and confirmed before execution.

  - id: narrated_trace_compile
    runtime_mode: narrated_compiled
    taskpack_role: narrated_trace_compile
    human_cost_keys: [demonstration, narration, compiler_review]
    purpose: Human Trace plus synchronized narration, compiled and reviewed.

  - id: feedback_r1
    runtime_mode: feedback
    taskpack_role: feedback_r1
    include_task_tags: [feedback-curve]
    human_cost_keys: [demonstration, narration, compiler_review, feedback_r1]
    purpose: First accumulated human feedback revision.

  - id: feedback_r2
    runtime_mode: feedback
    taskpack_role: feedback_r2
    include_task_tags: [feedback-curve]
    human_cost_keys: [demonstration, narration, compiler_review, feedback_r1, feedback_r2]
    purpose: Second accumulated human feedback revision.

  - id: feedback_r3
    runtime_mode: feedback
    taskpack_role: feedback_r3
    include_task_tags: [feedback-curve]
    human_cost_keys: [demonstration, narration, compiler_review, feedback_r1, feedback_r2, feedback_r3]
    purpose: Third accumulated human feedback revision.

  - id: feedback_r4
    runtime_mode: feedback
    taskpack_role: feedback_r4
    include_task_tags: [feedback-curve]
    human_cost_keys: [demonstration, narration, compiler_review, feedback_r1, feedback_r2, feedback_r3, feedback_r4]
    purpose: Fourth accumulated human feedback revision.

  - id: mismatched_trace
    runtime_mode: trace
    taskpack_role: mismatched_trace
    include_task_tags: [negative-control]
    human_cost_keys: [demonstration]
    purpose: A Trace from another family; detects generic extra-context or prompt-length effects.

