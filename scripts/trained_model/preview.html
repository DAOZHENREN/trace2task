<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Trace2Task D · 本地预测</title>
<style>body{font:17px system-ui;max-width:1100px;margin:40px auto;padding:20px;background:#f4f7f6;color:#173a30}textarea{width:100%;height:90px}button{padding:12px;margin:12px 8px 12px 0}img{max-width:100%;border:1px solid #aaa}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}#status{font-weight:bold}</style>
<h1>Trace2Task D · 结构化动作预测</h1><p>冻结 5970 步模型 · 仅本机 · A 阶段预览，不发送任何键鼠操作。</p>
<p>done 只代表模型停止预测，不代表任务成功。每次预览历史为空；拒绝或未执行的预测不会成为历史。</p>
<textarea id="task" placeholder="输入原始任务指令"></textarea><p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></p>
<button id="upload">预测所选图片</button><button id="capture">3 秒后截取主屏并预测</button>
<p>截图前请关闭敏感窗口；截图与日志只保存本机。加载服务的终端按 Ctrl+C 可停止服务。</p>
<p id="status">准备就绪：未执行操作</p><img id="image" alt="动作位置预览"><pre id="result"></pre>
<script>
const buttons=[document.querySelector('#upload'),document.querySelector('#capture')];
async function predict(capture){
 const task=document.querySelector('#task').value;
 if(!task.trim())return;
 buttons.forEach(b=>b.disabled=true);
 document.querySelector('#status').textContent=capture?'3 秒后截图，请切换到目标画面……':'正在预测……';
 document.querySelector('#image').removeAttribute('src');
 try{
  const body={task,capture};
  if(!capture){const file=document.querySelector('#file').files[0];if(!file)throw Error('请选择图片');
   body.image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});}
  const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json','X-Preview-Token':'__TOKEN__'},body:JSON.stringify(body)});
  if(!response.ok)throw Error(`HTTP ${response.status}`);
  const value=await response.json();
  if(value.annotated_image){document.querySelector('#image').src=value.annotated_image;delete value.annotated_image;}
  document.querySelector('#result').textContent=JSON.stringify(value,null,2);
  document.querySelector('#status').textContent=value.status==='predicted'?'预测完成，未执行任何操作':'预测失败，未执行任何操作';
 }catch(e){document.querySelector('#status').textContent='失败：'+e.message;}
 finally{buttons.forEach(b=>b.disabled=false);}
}
buttons[0].onclick=()=>predict(false);buttons[1].onclick=()=>predict(true);
</script></html>
