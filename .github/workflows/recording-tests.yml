name: Offline recording regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recording:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >-
          python -m pip install --only-binary=:all:
          'pytest>=8.3,<9' 'pygame>=2.6,<3' 'numpy>=2,<3' 'pyyaml>=6,<7'
      - run: node --check src/trace2task/web/app.js
      - run: >-
          python -m pytest tests/test_web_console.py
          -k 'narrated_recording or non_narrated_recording or waa_recording or web_server_serves'
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --only-binary=:all: 'pytest>=8.3,<9' 'pygame>=2.6,<3' 'numpy>=2,<3' 'pyyaml>=6,<7' 'pillow>=11,<13'
      - run: npm ci --prefix frontend --no-fund --no-audit
      - run: npm run build --prefix frontend
      - run: >-
          python -m pytest tests/test_run_session.py tests/test_local_gui_client_context.py
          tests/test_trace_evidence.py tests/test_trace_library.py tests/test_opencua_export_d.py
      - run: node --test tests/execution_entry.test.cjs tests/model_io_timeline.test.cjs
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
