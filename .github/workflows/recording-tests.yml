name: Offline recording regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recording:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >-
          python -m pip install --only-binary=:all:
          'pytest>=8.3,<9' 'pygame>=2.6,<3' 'numpy>=2,<3' 'pyyaml>=6,<7'
      - run: node --check src/trace2task/web/app.js
      - run: >-
          python -m pytest tests/test_web_console.py
          -k 'narrated_recording or non_narrated_recording or waa_recording or web_server_serves'
